name: Publish profile editor to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - scripts/thorium-profile-editor.html
      - .github/workflows/profile-editor-pages.yml
  workflow_dispatch:

permissions: {}
cache-mode: none

concurrency:
  group: profile-editor-pages
  cancel-in-progress: false

jobs:
  deploy_job:
    if: github.repository == 'edrlab/thorium-reader' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout standalone editor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/thorium-profile-editor.html
          sparse-checkout-cone-mode: false

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp scripts/thorium-profile-editor.html _site/index.html
          cp scripts/thorium-profile-editor.html _site/thorium-profile-editor.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload editor site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
