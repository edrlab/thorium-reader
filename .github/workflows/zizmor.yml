name: GitHub Actions Security Analysis with zizmor
# https://docs.zizmor.sh/integrations/#github-actions

on:
  push:
    branches: ["develop"]
    paths:
      - '.github/**'
      - '!.github/CODEOWNERS'
  pull_request:
    branches: ["**"]
    paths:
      - '.github/**'
      - '!.github/CODEOWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor_job:
    timeout-minutes: 10
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # see "advanced-security: true" in zizmor-action (upload-sarif will transfer SARIF files)
      contents: read # see actions/checkout
      actions: read # to access the workflow info
    steps:
###########################
      - name: Checkout repository
# https://github.com/actions/checkout/commits/v7.0.1
# https://github.com/actions/checkout/commits/3d3c42e5aac5ba805825da76410c181273ba90b1
# https://github.com/actions/checkout/compare/v7.0.1...3d3c42e5aac5ba805825da76410c181273ba90b1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
###########################
      - name: Run zizmor
# https://github.com/zizmorcore/zizmor-action/commits/v0.5.6
# https://github.com/zizmorcore/zizmor-action/commits/5f14fd08f7cf1cb1609c1e344975f152c7ee938d
# https://github.com/zizmorcore/zizmor-action/compare/v0.5.6...5f14fd08f7cf1cb1609c1e344975f152c7ee938d
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: true
          token: ${{ github.token }} # default
###########################
