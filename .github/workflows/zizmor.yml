name: GitHub Actions Security Analysis with zizmor
# https://docs.zizmor.sh/integrations/#github-actions

on:
  push:
    branches: ["develop"]
    paths:
      - '.github/**'
      - '!.github/CODEOWNERS'
  pull_request:
    branches: ["**"]
    paths:
      - '.github/**'
      - '!.github/CODEOWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#defaults
cache-mode: none

jobs:
  zizmor_job:
    timeout-minutes: 10
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # see "advanced-security: true" in zizmor-action (upload-sarif will transfer SARIF files)
      contents: read # see actions/checkout
      actions: read # to access the workflow info
    steps:
###########################
      - name: Checkout repository
# https://github.com/actions/checkout/commits/v7.0.1
# https://github.com/actions/checkout/commits/3d3c42e5aac5ba805825da76410c181273ba90b1
# https://github.com/actions/checkout/compare/v7.0.1...3d3c42e5aac5ba805825da76410c181273ba90b1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
###########################
      - name: Run zizmor
# https://github.com/zizmorcore/zizmor-action/commits/v0.7.1
# https://github.com/zizmorcore/zizmor-action/commits/85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e
# https://github.com/zizmorcore/zizmor-action/compare/v0.7.1...85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          advanced-security: true
          token: ${{ github.token }} # default
###########################
