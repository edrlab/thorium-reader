    "hook": {
      "on-activate": "#   # -> Set variables, create files and directories\n#   # -> Perform initialization steps, e.g. create a python venv\n#   # -> Useful environment variables:\n#   #      - FLOX_ENV_PROJECT=/home/user/example\n#   #      - FLOX_ENV=/home/user/example/.flox/run\n#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache\n\nlss () {\n    command ls -alshF --color=auto \"$@\"\n}\n\nexport NPM_CONFIG_PREFIX=\"${FLOX_ENV_CACHE}/NPM_PREFIX\";\nexport NPM_CONFIG_CACHE=\"${FLOX_ENV_CACHE}/NPM_CACHE\";\n\n#echo \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\n#ls -alshFR --color=auto \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\nmkdir -p .flox_tmp\nrm -f \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache/latest\"\ncp -R \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\" \".flox_tmp/.sfw-cache\" 2> /dev/null\n\n#rm -rf \"$NPM_CONFIG_PREFIX\";\nmkdir -p \"$NPM_CONFIG_PREFIX\";\n\n#rm -rf \"$NPM_CONFIG_CACHE\";\nmkdir -p \"$NPM_CONFIG_CACHE\";\n\nexport NODE_PATH=\"$NPM_CONFIG_PREFIX/lib/node_modules${NODE_PATH:+:$NODE_PATH}\";\n\nnpm install --ignore-scripts --foreground-scripts --min-release-age=3 --allow-git=root -g sfw\n\ncp -R \".flox_tmp/.sfw-cache\" \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\nrm -rf .flox_tmp\n#ls -alshFR --color=auto \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\n\nexport PATH=\"$NPM_CONFIG_PREFIX/bin:$PATH\";\n\nsfw --verbose npm install --ignore-scripts --foreground-scripts --min-release-age=3 --allow-git=root -g npm\n\n#echo \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\n#ls -alshFR --color=auto \"$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache\"\n\n"
    },
    "profile": {
      "common": "#   gum style \\\n#   --foreground 212 --border-foreground 212 --border double \\\n#   --align center --width 50 --margin \"1 2\" --padding \"2 4\" \\\n#     $INTRO_MESSAGE\n\nexport PATH=\"$NPM_CONFIG_PREFIX/bin:$PATH\";\nalias lss='ls -alshFGt --color=auto'\n\n"
