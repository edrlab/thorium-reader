schema-version = "1.19.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
nodejs.pkg-path = "nodejs"
jq.pkg-path = "jq"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"
FLOX_DISABLE_METRICS = "true"
CLICOLOR = "1"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache

lss () {
    command ls -alshF --color=auto "$@"
}

export NPM_CONFIG_PREFIX="${FLOX_ENV_CACHE}/NPM_PREFIX";
export NPM_CONFIG_CACHE="${FLOX_ENV_CACHE}/NPM_CACHE";

#echo "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"
#ls -alshFR --color=auto "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"
mkdir -p .flox_tmp
rm -f "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache/latest"
cp -R "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache" ".flox_tmp/.sfw-cache" 2> /dev/null

#rm -rf "$NPM_CONFIG_PREFIX";
mkdir -p "$NPM_CONFIG_PREFIX";

#rm -rf "$NPM_CONFIG_CACHE";
mkdir -p "$NPM_CONFIG_CACHE";

export NODE_PATH="$NPM_CONFIG_PREFIX/lib/node_modules${NODE_PATH:+:$NODE_PATH}";

npm install --ignore-scripts --foreground-scripts --min-release-age=3 --allow-git=root -g sfw

cp -R ".flox_tmp/.sfw-cache" "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"
rm -rf .flox_tmp
#ls -alshFR --color=auto "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"

export PATH="$NPM_CONFIG_PREFIX/bin:$PATH";

sfw --verbose npm install --ignore-scripts --foreground-scripts --min-release-age=3 --allow-git=root -g npm

#echo "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"
#ls -alshFR --color=auto "$NPM_CONFIG_PREFIX/lib/node_modules/sfw/.sfw-cache"

'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE

export PATH="$NPM_CONFIG_PREFIX/bin:$PATH";
alias lss='ls -alshFGt --color=auto'

'''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
